async function deriveKey(password, salt, iterations, usage) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt, iterations },
    base, { name: 'AES-GCM', length: 256 }, false, [usage]);
}
async function decrypt(P, password) {
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const key = await deriveKey(password, bytes(P.salt), P.iter, 'decrypt');
  const zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct));
  return new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
document.getElementById('gate').onsubmit = async e => {
  e.preventDefault();
  const go = document.getElementById('go'), msg = document.getElementById('msg');
  go.disabled = true;
  msg.textContent = '';
  try {
    const html = await decrypt(P, document.getElementById('pw').value);
    document.open();
    document.write(html);
    document.close();
  } catch {
    msg.textContent = '비밀번호가 맞지 않습니다';
    go.disabled = false;
  }
};
